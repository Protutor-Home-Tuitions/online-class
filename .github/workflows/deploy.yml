name: Deploy to ProTutor BigRock

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get install -y lftp

      - name: Deploy via FTP to BigRock
        run: |
          lftp -c "
          set ftp:ssl-allow no;
          set net:timeout 30;
          set net:max-retries 3;
          open ftp://${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}@119.18.54.24;
          mirror --reverse --delete --verbose \
            --exclude .git \
            --exclude .github \
            --exclude README.md \
            ./ ${{ secrets.FTP_PATH }}/;
          bye"
